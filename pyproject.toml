[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slopdam"
version = "0.3.0"
description = "Logger formatter and linter that strips AI-generated patterns (em dashes, emoji, separators, markdown) from log output"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "The slopdam Authors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Natural Language :: Korean",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Logging",
    "Topic :: Text Processing :: Filters",
    "Typing :: Typed",
]
requires-python = ">=3.9"
keywords = ["logging", "formatter", "linter", "korean", "ai", "slop"]

[project.urls]
Homepage = "https://github.com/slopdam/slopdam"
Repository = "https://github.com/slopdam/slopdam"
Issues = "https://github.com/slopdam/slopdam/issues"
Changelog = "https://github.com/slopdam/slopdam/blob/main/CHANGELOG.md"

[project.scripts]
slopdam = "slopdam.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/slopdam"]
