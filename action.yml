name: slopdam
description: Find AI-generated traces (em dashes, emoji, separators, markdown) in log and print calls, in any language
author: The slopdam Authors
branding:
  icon: filter
  color: blue

inputs:
  paths:
    description: Files or directories to check, separated by spaces
    default: "."
  profile:
    description: reader (default) or dev
    default: ""
  scope:
    description: log-calls (default), strings or all
    default: ""
  format:
    description: github (annotations on the pull request, default), text, json or sarif
    default: github
  args:
    description: Extra options placed before the check command, such as "--disable tone --level strong"
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - name: Install slopdam
      shell: bash
      run: python -m pip install --quiet "$GITHUB_ACTION_PATH"
    - name: Run slopdam check
      shell: bash
      env:
        SLOPDAM_PATHS: ${{ inputs.paths }}
        SLOPDAM_PROFILE: ${{ inputs.profile }}
        SLOPDAM_SCOPE: ${{ inputs.scope }}
        SLOPDAM_FORMAT: ${{ inputs.format }}
        SLOPDAM_ARGS: ${{ inputs.args }}
      run: |
        opts=()
        [ -n "$SLOPDAM_PROFILE" ] && opts+=(--profile "$SLOPDAM_PROFILE")
        check=(--format "$SLOPDAM_FORMAT")
        [ -n "$SLOPDAM_SCOPE" ] && check+=(--scope "$SLOPDAM_SCOPE")
        read -r -a extra <<< "$SLOPDAM_ARGS"
        read -r -a paths <<< "$SLOPDAM_PATHS"
        slopdam "${opts[@]}" "${extra[@]}" check "${check[@]}" "${paths[@]}"
