name: release-js

# Push a tag like js-v0.1.0 to publish @slopdam/core (the js/ folder) to npm.
# Python releases use v* tags and release.yml; the two never trigger each other.
# Uses npm trusted publishing (OIDC), so no npm token is stored in the repository.
# npm can only attach a trusted publisher to a package that already exists, so the very
# first version (0.1.0) is published once by a maintainer from their own machine. After
# that, on npmjs.com: @slopdam/core > Settings > Trusted publishing > GitHub Actions,
# organization slopdam, repository slopdam, workflow release-js.yml. npm drops a new
# configuration that has not published within 2 days, so add it when the next version is due.
# A version that is already on npm is skipped, so tagging a hand-published version is safe.

on:
  push:
    tags: ["js-v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Tag matches package.json
        run: test "js-v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Skip if this version is already on npm
        id: published
        # Compare the version npm returns, not just the exit code: js-v0.3.0 was skipped
        # although 0.3.0 had never been published.
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$(npm view "@slopdam/core@$version" version 2>/dev/null)" = "$version" ]; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::@slopdam/core $version is already on npm; nothing to publish."
          else
            echo "::notice::@slopdam/core $version is not on npm yet; publishing."
          fi
      - if: steps.published.outputs.already != 'true'
        run: npm ci
      - if: steps.published.outputs.already != 'true'
        run: npm test
      - if: steps.published.outputs.already != 'true'
        run: npm publish --provenance --access public
