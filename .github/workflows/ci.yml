name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest]
        include:
          # ubuntu-latest (26.04) no longer ships 3.9, but macOS's system python3 is still 3.9.
          - python: "3.9"
            os: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[test]"
      - run: python -m pytest -q

  dogfood:
    # The project's own log strings must pass its own linter, run through the published GitHub Action.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          paths: src/

  bench:
    # Timing of clean() on typical log lines, shown in the job summary. Informational, never fails.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python scripts/bench.py >> "$GITHUB_STEP_SUMMARY"

  spec:
    # spec/rules.json and the expected outputs in spec/conformance.json must match the Python source.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python scripts/gen_spec.py --check

  package:
    # The sdist and wheel build, pass twine's metadata check and work when installed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          echo '✅ **Saved** — 3 rows' | /tmp/smoke/bin/slopdam clean | grep -qx 'Saved: 3 rows'

  js:
    # @slopdam/core: every conformance case against the ESM and CommonJS builds.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24"]
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test

  js-package:
    # What npm would publish: install the packed tarball and load both entry points.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm ci && npm run build && npm pack
      - run: |
          mkdir /tmp/smoke && cd /tmp/smoke && npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE"/js/slopdam-core-*.tgz
          node -e "const {clean} = require('@slopdam/core'); if (clean('✅ **Saved** — 3 rows') !== 'Saved: 3 rows') process.exit(1)"
          node --input-type=module -e "import {clean} from '@slopdam/core'; if (clean('✅ 저장 ㅡ 완료') !== '저장: 완료') process.exit(1)"
          node -e "require('@slopdam/core/pino').slopdamPino(); require('@slopdam/core/winston').slopdamWinston()"
          node --input-type=module -e "import {slopdamPino} from '@slopdam/core/pino'; import {slopdamWinston} from '@slopdam/core/winston'; slopdamPino(); slopdamWinston()"
          node --input-type=module -e "import slopdam from '@slopdam/core/eslint'; if (!slopdam.rules['no-slop']) process.exit(1)"

  go:
    # The Go module: spec_data.go is current, and every conformance case passes.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.22", "stable"]
    env:
      GOWORK: "off" # go/go.work needs Go 1.26 for the analyzer; the package itself supports 1.22
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go/go.sum
      - run: go generate ./... && git diff --exit-code -- spec_data.go
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      - run: go test ./...

  go-vet:
    # The go vet analyzer (its own module, Go 1.26+ because of golang.org/x/tools).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go/vet
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: go/vet/go.sum
      - run: go vet ./...
      - run: go test ./...
      - run: go build -o /tmp/slopdamvet ./cmd/slopdamvet
      # The package's own log calls are clean; its tests log traces on purpose, so they are skipped.
      - run: cd .. && /tmp/slopdamvet -test=false ./...
      # go vet -vettool: passes on a clean call, fails on a trace.
      - run: |
          mkdir /tmp/vt && cd /tmp/vt && go mod init vt
          printf 'package vt\n\nimport "log"\n\nfunc F() { log.Print("ok") }\n' > a.go
          go vet -vettool=/tmp/slopdamvet ./...
          printf 'package vt\n\nimport "log"\n\nfunc G() { log.Print("🚀 x — y") }\n' > b.go
          ! go vet -vettool=/tmp/slopdamvet ./...

  java:
    # The Java modules: core (every conformance case), Logback and Log4j 2 converters.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["17", "21"]
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: mvn -B verify
