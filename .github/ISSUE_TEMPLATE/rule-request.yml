name: Rule request
description: Suggest a trace slopdam should catch
labels: [rule-request]
body:
  - type: textarea
    id: examples
    attributes:
      label: Text that should be caught (real AI output is best)
    validations:
      required: true
  - type: textarea
    id: preserve
    attributes:
      label: Similar text that must not be caught
  - type: textarea
    id: expected
    attributes:
      label: Expected output (reader and dev)
