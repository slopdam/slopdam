name: Wrong change (false positive)
description: slopdam changed text it should have left alone
labels: [false-positive]
body:
  - type: input
    id: input
    attributes:
      label: Input
    validations:
      required: true
  - type: input
    id: output
    attributes:
      label: Actual output
    validations:
      required: true
  - type: input
    id: expected
    attributes:
      label: Expected output
    validations:
      required: true
  - type: dropdown
    id: profile
    attributes:
      label: Profile
      options: [reader (default), dev]
  - type: input
    id: version
    attributes:
      label: slopdam version
      placeholder: python -c "import slopdam; print(slopdam.__version__)"
